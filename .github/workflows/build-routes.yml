name: Build Wander Atlas routes

on:
  push:
    paths:
      - 'gpx/**.gpx'
      - 'scripts/build_routes.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Convert GPX files and rebuild route list
        run: python scripts/build_routes.py

      - name: Commit generated routes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/
          if git diff --cached --quiet; then
            echo "No route changes"
          else
            git commit -m "Update Wander Atlas routes"
            git push
          fi
